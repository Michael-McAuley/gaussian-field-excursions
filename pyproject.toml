[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gaussian-field-excursions"
version = "0.1.0"
description = "Simulation and visualisation of two-dimensional Gaussian-field excursion sets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gstools==1.7.0",
    "matplotlib==3.11.1",
    "numpy==2.5.2",
    "scipy==1.18.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["gaussian_field_excursions"]
